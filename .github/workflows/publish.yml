name: publish

# cosend-app -> npm, with provenance, via npm Trusted Publishing (OIDC).
#
# npm side: one Trusted Publisher, on the cosend-app package, with owner cosendhq, repository
# cosend-node, workflow filename publish.yml, no environment, and "npm publish" allowed
# (configurations made after 3 Sep 2026 allow only `npm stage publish` unless that box is ticked).
# The filename is part of the trust, so renaming this file breaks publishing until the npm setting
# changes too. There is no NPM_TOKEN: npm exchanges this job's OIDC token for a short-lived
# publish token. A trusted publisher can only be added to a package that already exists on npm;
# cosend-app does, published once from the cosendapp account.
#
# Trusted Publishing needs npm CLI >= 11.5.1, Node >= 22.14.0, a GitHub-hosted runner and
# `id-token: write`. npm only generates provenance from a PUBLIC repository, and each
# package.json `repository.url` must name this repository.
#
# To release: land the version bump on main, then publish a GitHub release whose tag is
# v<cosend-app's version>, e.g. v1.0.0. A version already on npm is skipped, so a rerun after a
# failure finishes the job instead of failing on the published version.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No dependency cache: a publish job should not restore state another run wrote.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm >= 11.5.1 (Trusted Publishing)
        run: |
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != 11.5.1 ]; then
            npm install -g npm@11
          fi
          node --version
          npm --version

      - name: The release tag names cosend-app's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./packages/cosend-app/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match packages/cosend-app version $version (expected v$version)."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Publish cosend-app
        working-directory: packages/cosend-app
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public
